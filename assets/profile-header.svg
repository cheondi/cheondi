<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img">
  <title>Cheondi developer profile header</title>
  <desc>Unity에서 시작해 API와 운영 문제까지 추적하는 개발자 Cheondi</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#07111b"/>
      <stop offset="1" stop-color="#0d1b2a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="48%" r="55%">
      <stop offset="0" stop-color="#58a6ff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#58a6ff" stroke-opacity=".07"/>
    </pattern>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    .cursor { animation: blink 1s steps(1) infinite; }
    .signal { animation: pulse 2.4s ease-in-out infinite; transform-origin:center; }
    .scan { animation: scan 6s linear infinite; }
    @keyframes blink { 50% { opacity:0; } }
    @keyframes pulse { 50% { opacity:.35; } }
    @keyframes scan { from { transform:translateX(-1200px); } to { transform:translateX(1200px); } }
    @media (prefers-reduced-motion: reduce) { .cursor,.signal,.scan { animation:none; } }
  </style>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#glow)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>
  <path class="scan" d="M0 0H180L80 320H-100Z" fill="#79c0ff" opacity=".035"/>
  <rect x="1" y="1" width="1198" height="318" rx="23" fill="none" stroke="#30363d"/>
  <path d="M0 64H1200" stroke="#30363d"/>
  <circle cx="42" cy="32" r="6" fill="#ff7b72"/>
  <circle cx="64" cy="32" r="6" fill="#d29922"/>
  <circle cx="86" cy="32" r="6" fill="#3fb950"/>
  <text x="118" y="38" class="mono" font-size="13" fill="#6e7681">cheondi@github: ~/profile</text>
  <text x="600" y="112" text-anchor="middle" class="mono" font-size="17" font-weight="700" letter-spacing="4" fill="#79c0ff">PLAYER / DEVELOPER / PROBLEM SOLVER</text>
  <text x="600" y="187" text-anchor="middle" class="mono" font-size="56" font-weight="800" fill="#f0f6fc" filter="url(#softGlow)">&gt; CHEONDI<tspan class="cursor" fill="#58a6ff">_</tspan></text>
  <text x="600" y="235" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="20" fill="#8b949e">Unity에서 시작해 API와 운영 문제까지 끝까지 추적하는 개발자</text>
  <g class="signal">
    <circle cx="548" cy="278" r="4" fill="#3fb950"/>
    <text x="565" y="283" class="mono" font-size="14" fill="#7ee787">SYSTEM ONLINE</text>
  </g>
</svg>
